services:
  - type: web
    name: quant-research-v4-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MPLBACKEND
        value: Agg
      - key: ALLOWED_ORIGINS
        sync: false
